name: Run Backtest Script

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the backtest
        run: |
          python backtest.py

      - name: List generated files (debug)
        run: |
          echo "=== backtest_reports ==="
          ls -lah backtest_reports || true
          echo "=== analytics ==="
          ls -lah analytics || true

      - name: Commit report & analytics files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Generate new backtest reports and analytics CSVs"
          # You can specify multiple patterns with a newline between them:
          file_pattern: |
            backtest_reports/*.txt
            analytics/*.csv
          commit_user_name: GitHub Actions Bot
          commit_user_email: actions@github.com
          commit_author: GitHub Actions Bot <actions@github.com>
