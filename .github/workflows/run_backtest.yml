name: Run Backtest Script

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the backtest
        run: |
          python backtest.py

      - name: List generated files (debug)
        run: |
          echo "=== backtest_reports ==="
          ls -lah backtest_reports || true
          echo "=== analytics ==="
          ls -lah analytics || true
          echo "=== .gitignore (if present) ==="
          [ -f .gitignore ] && cat .gitignore || echo "no .gitignore"

      - name: Preview first 5 lines of each analytics CSV (debug)
        run: |
          shopt -s nullglob
          for f in analytics/*.csv; do
            echo "----- $f (head -n 5) -----"
            head -n 5 "$f" || true
            echo
          done

      - name: Commit report & analytics files
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add -A backtest_reports
          git add -A analytics
          git commit -m "Generate new backtest reports and analytics CSVs [with previews]" || echo "No changes to commit"
          git push
