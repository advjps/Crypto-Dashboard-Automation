name: Generate TotalStrong CSV

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  total-strong:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pytz requests

      - name: Run TotalStrong.py
        run: |
          python TotalStrong.py

      - name: Commit TotalStrong CSV back to repo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add analytics/TotalStrong_*.csv
          git commit -m "Add TotalStrong CSV [skip ci]" || echo "No changes to commit"
          git push
