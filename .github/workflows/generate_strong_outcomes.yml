name: Generate Strong Outcomes

# Manual trigger only
on:
  workflow_dispatch:
    inputs:
      input_csv:
        description: 'Optional path to TotalStrong CSV (e.g. analytics/TotalStrong_2025-09-08_12-00-00.csv). Leave empty to auto-detect.'
        required: false
        default: ''
      python-version:
        description: 'Python version to use'
        required: false
        default: '3.10'
      commit_changes:
        description: 'Whether to commit generated CSV(s) back to the repo (true/false)'
        required: false
        default: 'true'

permissions:
  contents: write   # required if committing back to repo
  actions: read

jobs:
  run-strongoutcome:
    name: Run strongoutcome.py (manual)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (with token for pushing)
        uses: actions/checkout@v4
        with:
          persist-credentials: true  # allows pushing back using GITHUB_TOKEN
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ github.event.inputs['python-version'] || '3.10' }}

      - name: Install requirements (if present)
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install --upgrade pip
            pip install -r requirements.txt
          else
            python -m pip install --upgrade pip
          fi

      - name: Run strongoutcome.py
        id: run_strong
        run: |
          set -e
          # Use provided input CSV if given, else let script auto-detect
          if [ -n "${{ github.event.inputs.input_csv }}" ]; then
            python strongoutcome.py --input "${{ github.event.inputs.input_csv }}"
          else
            python strongoutcome.py
          fi
        env:
          # if your script uses PROXY env vars you may set them here:
          # HTTP_PROXY: http://user:pass@host:port
          # HTTPS_PROXY: http://user:pass@host:port
          # (leave blank if not needed)
          HTTP_PROXY: ${{ secrets.HTTP_PROXY || '' }}
          HTTPS_PROXY: ${{ secrets.HTTPS_PROXY || '' }}

      - name: Show analytics directory
        if: always()
        run: |
          echo "analytics/ contents:"
          ls -la analytics || true

      - name: Upload analytics CSVs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: total-strong-outcomes
          path: |
            analytics/TotalStrong_outcomes_*.csv
            analytics/*.csv

      - name: Commit generated CSVs back to repo (optional)
        if: ${{ github.event.inputs.commit_changes == 'true' }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # add any new/modified analytics CSVs
          git add analytics/*.csv || true
          # check if there are changes
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: add/update strong outcome CSVs (generated by workflow)" || true
            git push origin HEAD:${GITHUB_REF#refs/heads/}
            echo "Committed generated CSV(s) back to repo."
          fi

      - name: Print summary
        if: always()
        run: |
          echo "Workflow finished. Generated CSVs (if any) are in analytics/ and uploaded as artifact."
