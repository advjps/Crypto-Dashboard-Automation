name: Strong Outcome Backtest

on:
  workflow_dispatch:  # manual trigger only

jobs:
  strongoutcome:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Run strongoutcome.py
        run: python strongoutcome.py

      - name: Upload Strong Outcome CSVs
        uses: actions/upload-artifact@v4
        with:
          name: strongoutcome-reports
          path: |
            analytics/strongoutcome_detailed.csv
            analytics/strongoutcome_summary.csv
