name: Strong Outcome Backtest

on:
  workflow_dispatch:  # manual trigger only

jobs:
  strongoutcome:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas pytz

      - name: Run strongoutcome.py with IST timestamp
        run: |
          # Generate IST timestamp
          IST_TS=$(python - <<'PYCODE'
import pytz, datetime
ist = pytz.timezone("Asia/Kolkata")
now = datetime.datetime.now(ist)
print(now.strftime("%Y-%m-%d_%H-%M-%S_IST"))
PYCODE
)
          echo "IST_TS=$IST_TS" >> $GITHUB_ENV

          # Run script and rename outputs with timestamp
          python strongoutcome.py
          mkdir -p analytics
          if [ -f analytics/strongoutcome_detailed.csv ]; then
            mv analytics/strongoutcome_detailed.csv analytics/strongoutcome_detailed_${IST_TS}.csv
          fi
          if [ -f analytics/strongoutcome_summary.csv ]; then
            mv analytics/strongoutcome_summary.csv analytics/strongoutcome_summary_${IST_TS}.csv
          fi

      - name: Upload Strong Outcome CSVs
        uses: actions/upload-artifact@v4
        with:
          name: strongoutcome-reports
          path: analytics/strongoutcome_*.csv
