name: Merge Analytics

on:
  workflow_dispatch:
  
jobs:
  merge-analytics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pytz

      - name: Run Merge Analytics
        run: |
          python merge_analytics.py

      - name: Commit & Push Analytics
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add analytics/all_signals.csv analytics/summary_*.txt analytics/summary_by_*.csv analytics/summary_deserved_*.csv || true
          git commit -m "Auto-update merged analytics" || echo "No changes to commit"
          git push
